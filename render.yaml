services:
  - type: web
    name: calculadora-motorista-api
    branch: master
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calculadora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: calculadora-db
    plan: free
